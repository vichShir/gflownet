device: cpu
float_precision: 32
n_samples: 100
seed: 0
env:
  _target_: gflownet.envs.tetris.Tetris
  env_id: env
  fixed_distr_params: null
  random_distr_params: null
  skip_mask_check: false
  conditional: false
  continuous: false
  id: tetris
  width: 7
  height: 9
  pieces:
  - I
  - J
  - L
  - O
  - S
  - T
  rotations:
  - 0
  allow_redundant_rotations: false
  allow_eos_before_full: true
gflownet:
  _target_: gflownet.gflownet.GFlowNetAgent
  seed: 0
  optimizer:
    lr: 0.0001
    lr_decay_period: 1000000
    lr_decay_gamma: 0.5
    method: adam
    adam_beta1: 0.9
    adam_beta2: 0.999
    sgd_momentum: 0.9
    batch_size:
      forward: 10
      backward_dataset: 0
      backward_replay_reward: 0
      backward_replay_loss: 0
    train_to_sample_ratio: 1
    n_train_steps: 5000
    bootstrap_tau: 0.0
    clip_grad_norm: 0.0
    lr_z_mult: 10
    z_dim: 16
  state_flow: null
  mask_invalid_actions: true
  temperature_logits: 1.0
  random_action_prob: 0.0
  replay_sampling: permutation
  train_sampling: permutation
  use_context: false
  garbage_collection_period: 0
  collect_reversed_logprobs: false
loss:
  _target_: gflownet.losses.trajectorybalance.TrajectoryBalance
  early_stopping_th: 0.0
  ema_alpha: 0.5
policy:
  _target_: gflownet.policy.base.Policy
  shared: null
  forward:
    type: mlp
    n_hid: 128
    n_layers: 2
    checkpoint: null
    reload_ckpt: false
  backward:
    shared_weights: true
    checkpoint: null
    reload_ckpt: false
proxy:
  _target_: gflownet.proxy.tetris.Tetris
  reward_function: exponential
  logreward_function: null
  reward_function_kwargs:
    alpha: 1.0
    beta: 15.0
  reward_min: 0.0
  do_clip_rewards: false
  normalize: true
logger:
  _target_: gflownet.utils.logger.Logger
  do:
    online: false
    times: false
  project_name: GFlowNet
  logdir:
    root: ./logs
    ckpts: ckpts
    overwrite: true
  debug: false
  lightweight: false
  progressbar:
    skip: false
    n_iters_mean: 100
  context: '0'
  notes: null
  entity: null
  run_id: null
  is_resumed: false
  run_name: null
  run_name_date: true
  run_name_job: true
  tags:
  - gflownet
user:
  logdir:
    root: ./logs
  data:
    root: ./data
    alanine_dipeptide: ~/gflownet/data/alanine_dipeptide_conformers_1.npy
evaluator:
  _target_: gflownet.evaluator.base.BaseEvaluator
  first_it: true
  period: 5000
  'n': 100
  kde:
    bandwidth: 0.1
    kernel: gaussian
  n_top_k: 5000
  top_k: 100
  top_k_period: -1
  n_trajs_logprobs: 10
  logprobs_batch_size: 100
  logprobs_bootstrap_size: 10000
  max_data_logprobs: 100000.0
  n_grid: 40000
  train_log_period: 1
  checkpoints_period: 100
  metrics: all
buffer:
  _target_: gflownet.buffer.base.BaseBuffer
  replay_buffer: null
  replay_capacity: 0
  replay_criterion: reward
  train:
    type: null
    path: null
    'n': null
    seed: null
  test:
    type: null
    path: null
    'n': null
    seed: null
  use_main_buffer: false
  check_diversity: false
  diversity_check_reward_similarity: 0.1
  progress_process_dataset: false
