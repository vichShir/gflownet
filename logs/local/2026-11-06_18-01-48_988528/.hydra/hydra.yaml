hydra:
  run:
    dir: ${user.logdir.root}/${oc.env:SLURM_JOB_ID,local}/${now:%Y-%m-%d_%H-%M-%S_%f}
  sweep:
    dir: ${user.logdir.root}/${oc.env:SLURM_JOB_ID,local}/multirun/${now:%Y-%m-%d_%H-%M-%S_%f}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - env=tetris
    - proxy=tetris
    - gflownet=trajectorybalance
    - env.width=7
    - env.height=9
    - env.pieces=[I,J,L,O,S,T]
    - env.rotations=[0]
    - env.allow_eos_before_full=True
    - n_samples=100
    - proxy.reward_function=exponential
    - +proxy.reward_function_kwargs.alpha=1.0
    - '+proxy.reward_function_kwargs={beta: 15.0}'
    - gflownet.optimizer.n_train_steps=5000
    - evaluator.period=5000
    - evaluator.checkpoints_period=100
    - device=cpu
    - logger.do.online=False
    - user.logdir.root=./logs
  job:
    name: train
    chdir: false
    override_dirname: '+proxy.reward_function_kwargs.alpha=1.0,+proxy.reward_function_kwargs={beta:
      15.0},device=cpu,env.allow_eos_before_full=True,env.height=9,env.pieces=[I,J,L,O,S,T],env.rotations=[0],env.width=7,env=tetris,evaluator.checkpoints_period=100,evaluator.period=5000,gflownet.optimizer.n_train_steps=5000,gflownet=trajectorybalance,logger.do.online=False,n_samples=100,proxy.reward_function=exponential,proxy=tetris,user.logdir.root=./logs'
    id: ???
    num: ???
    config_name: train
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.1'
    cwd: /home/victor/projects/sardinha/gflownet
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/victor/projects/sardinha/gflownet/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/victor/projects/sardinha/gflownet/logs/local/2026-11-06_18-01-48_988528
    choices:
      buffer: base
      evaluator: base
      user: default
      logger: wandb
      proxy: tetris
      loss: trajectorybalance
      gflownet: trajectorybalance
      env: tetris
      policy: mlp_trajectorybalance
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
